# The factory-default setup end-to-end test (tests/setup_e2e/, DEVELOPMENT.md
# 6.2): boots an EMPTY factory-default Linux VM, installs Rust by the
# documented human steps, runs `cargo build` (which IS setup) answering its
# real console prompts, rides through the reboot when setup requests one, and
# then runs the full test suite inside the guest. Needs only KVM, which
# GitHub's standard Linux runners expose.
#
# (A Windows factory test existed but was removed: WSL2 inside a guest needs a
# virtualisation depth neither Windows hosts nor hosted runners provide. Its
# recipe and findings live in git history under tests/setup_e2e/windows.)
name: setup-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "14 3 * * 1" # weekly (the run takes ~3 min on a fast host; longer on hosted runners)

jobs:
  linux-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Give the runner user access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the VM tooling (QEMU x86-64 + the ISO builder)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Cache the Ubuntu cloud image
        uses: actions/cache@v4
        with:
          path: ~/.cache/formal-e2e/images
          key: formal-e2e-ubuntu-noble
      - name: Factory-default Linux setup + suite (inside a KVM guest)
        run: cargo nextest run --run-ignored all -E 'test(factory_default_linux)' --no-capture
      - name: Upload the driver/serial/build/suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-e2e-linux-logs
          path: target/tmp/test-logs/
